name: Reportar un error
description: Informa de un fallo para que podamos reproducirlo y corregirlo.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por ayudar a mejorar **ytpremiun-vip**. No incluyas cookies,
        tokens ni contenido privado.
  - type: input
    id: version
    attributes:
      label: Versión
      description: Salida de `python -m ytpremiun_vip --version`
      placeholder: "ytpremiun-vip 0.1.0"
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Sistema y Python
      description: Sistema operativo y versión de Python
      placeholder: "Windows 11, Python 3.14.5"
    validations:
      required: true
  - type: dropdown
    id: ffmpeg
    attributes:
      label: ¿Tienes ffmpeg instalado?
      options:
        - "Sí"
        - "No"
        - "No estoy seguro"
    validations:
      required: true
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción del fallo
      description: ¿Qué esperabas que pasara y qué pasó realmente?
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      description: Incluye el comando completo y una URL de ejemplo si aplica.
      placeholder: |
        1. Ejecuté `python -m ytpremiun_vip ...`
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Salida o traza
      description: Pega la salida con `-v` si es un error de red o extracción.
      render: shell
    validations:
      required: false
